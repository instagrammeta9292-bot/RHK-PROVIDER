<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RHK PROVIDER - Download APKs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; }
    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 2.2rem; color: #38bdf8; margin-bottom: 8px; }
    header p { color: #94a3b8; font-size: 0.95rem; }

    .controls { max-width: 600px; margin: 0 auto 30px; display: flex; flex-direction: column; gap: 16px; }
    .search-box { width: 100%; }
    .search-box input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 1rem; outline: none; }
    .search-box input:focus { border-color: #38bdf8; }

    .filters { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .filter-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .filter-btn:hover, .filter-btn.active { background: #0284c7; color: white; border-color: #0284c7; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 16px; padding: 20px; text-align: center; border: 1px solid #334155; position: relative; }
    .card img { width: 72px; height: 72px; border-radius: 16px; object-fit: cover; margin-bottom: 12px; }
    .card h3 { font-size: 1.2rem; margin-bottom: 4px; }
    .card .badge { position: absolute; top: 12px; right: 12px; background: #334155; color: #38bdf8; font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; font-weight: bold; }
    .card .version { color: #94a3b8; font-size: 0.85rem; margin-bottom: 12px; display: block; }
    .card p { color: #cbd5e1; font-size: 0.9rem; margin-bottom: 16px; line-height: 1.4; }
    .download-btn { display: inline-block; background: #0284c7; color: white; padding: 10px 20px; text-decoration: none; border-radius: 8px; font-weight: bold; width: 100%; }
    .download-btn:hover { background: #0369a1; }
  </style>
</head>
<body>

  <header>
    <h1>RHK PROVIDER</h1>
    <p>Official Store for Android Apps & Games</p>
  </header>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search apps by name..." oninput="filterApps()">
    </div>
    <div class="filters">
      <button class="filter-btn active" onclick="setCategory('All', this)">All</button>
      <button class="filter-btn" onclick="setCategory('Apps', this)">Apps</button>
      <button class="filter-btn" onclick="setCategory('Games', this)">Games</button>
      <button class="filter-btn" onclick="setCategory('Tools', this)">Tools</button>
    </div>
  </div>

  <main class="grid" id="app-container">
    <p style="grid-column: 1/-1; text-align: center;">Loading apps...</p>
  </main>

  <script>
    const USERNAME = "YOUR_GITHUB_USERNAME"; // <-- REPLACE THIS WITH YOUR GITHUB USERNAME
    const REPO = "RHK-PROVIDER";

    let allApps = [];
    let currentCategory = 'All';

    async function fetchApps() {
      const container = document.getElementById('app-container');
      try {
        const res = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/content/apks`);
        if (!res.ok) {
          container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No apps uploaded yet.</p>';
          return;
        }
        const files = await res.json();
        allApps = [];

        for (let file of files) {
          if (file.name.endsWith('.json')) {
            const raw = await fetch(file.download_url);
            const app = await raw.json();
            allApps.push(app);
          }
        }
        renderApps(allApps);
      } catch (err) {
        container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Error loading apps.</p>';
      }
    }

    function renderApps(appsToRender) {
      const container = document.getElementById('app-container');
      if (appsToRender.length === 0) {
        container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #94a3b8;">No apps found.</p>';
        return;
      }

      container.innerHTML = appsToRender.map(app => {
        const downloadUrl = app.apk_file || app.external_link || '#';
        const catTag = app.category ? `<span class="badge">${app.category}</span>` : '';
        return `
          <div class="card">
            ${catTag}
            <img src="${app.icon || 'https://via.placeholder.com/72'}" alt="${app.title}">
            <h3>${app.title}</h3>
            <span class="version">Version ${app.version}</span>
            <p>${app.description || ''}</p>
            <a href="${downloadUrl}" class="download-btn" download>Download APK</a>
          </div>
        `;
      }).join('');
    }

    function setCategory(category, button) {
      currentCategory = category;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
      filterApps();
    }

    function filterApps() {
      const searchQuery = document.getElementById('search-input').value.toLowerCase();
      const filtered = allApps.filter(app => {
        const matchesCategory = currentCategory === 'All' || app.category === currentCategory;
        const matchesSearch = app.title.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesSearch;
      });
      renderApps(filtered);
    }

    fetchApps();
  </script>
</body>
</html>
