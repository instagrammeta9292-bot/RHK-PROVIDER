<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RHK PROVIDER - Admin</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:#0b0b0f;
    color:#fff;
    padding:20px;
}

.container{
    max-width:650px;
    margin:40px auto;
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:800;
    margin-bottom:10px;
}

.logo span{
    color:#7c5cff;
}

.subtitle{
    text-align:center;
    color:#888892;
    margin-bottom:30px;
}

.card{
    background:#15151b;
    border:1px solid #292932;
    border-radius:20px;
    padding:25px;
}

label{
    display:block;
    margin:18px 0 8px;
    color:#ddd;
    font-size:14px;
    font-weight:600;
}

input,
select,
textarea{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #30303a;
    background:#0f0f14;
    color:#fff;
    outline:none;
    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#7c5cff;
}

textarea{
    min-height:110px;
    resize:vertical;
}

button{
    width:100%;
    border:0;
    padding:15px;
    border-radius:12px;
    background:#7c5cff;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:25px;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.status{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    line-height:1.5;
    text-align:center;
}

.status.success{
    display:block;
    background:#13251a;
    border:1px solid #285a35;
    color:#8ff0a5;
}

.status.error{
    display:block;
    background:#281416;
    border:1px solid #633136;
    color:#ff9292;
}

.note{
    margin-top:20px;
    color:#777780;
    font-size:13px;
    line-height:1.6;
    text-align:center;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#a996ff;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
RHK <span>PROVIDER</span>
</div>

<div class="subtitle">
Admin Panel
</div>

<div class="card">

<form id="appForm">

<label>
Admin Key
</label>

<input
    type="password"
    id="adminKey"
    placeholder="Enter admin key"
    autocomplete="off"
    required
>

<label>
App Name
</label>

<input
    type="text"
    id="name"
    placeholder="Example: My App"
    required
>

<label>
Version
</label>

<input
    type="text"
    id="version"
    placeholder="Example: 1.0"
    required
>

<label>
Platform
</label>

<input
    type="text"
    id="platform"
    value="Android"
>

<label>
Category
</label>

<select id="category">

<option value="tools">
Tools
</option>

<option value="video">
Video
</option>

<option value="other">
Other
</option>

</select>

<label>
Description
</label>

<textarea
    id="description"
    placeholder="Describe the application..."
></textarea>

<label>
Image File Name
</label>

<input
    type="text"
    id="image"
    placeholder="Example: myapp.png"
>

<label>
Download APK URL
</label>

<input
    type="url"
    id="download"
    placeholder="https://github.com/..."
    required
>

<button
    type="submit"
    id="submitButton"
>
Add App
</button>

<div
    class="status"
    id="status"
></div>

</form>

</div>

<div class="note">

The app will be added to
<strong>apps.json</strong>
through the Cloudflare API.

<br>

Do not share your Admin Key.

</div>

<a
    class="back"
    href="./"
>
← Back to RHK PROVIDER
</a>

</div>

<script>

/*
========================================
YOUR CLOUDFLARE API WORKER URL
========================================
*/

const API_URL =
"https://young-pond-e02e.rhk4133.workers.dev";


/*
========================================
ELEMENTS
========================================
*/

const form =
document.getElementById("appForm");

const adminKey =
document.getElementById("adminKey");

const nameInput =
document.getElementById("name");

const versionInput =
document.getElementById("version");

const platformInput =
document.getElementById("platform");

const categoryInput =
document.getElementById("category");

const descriptionInput =
document.getElementById("description");

const imageInput =
document.getElementById("image");

const downloadInput =
document.getElementById("download");

const submitButton =
document.getElementById("submitButton");

const statusBox =
document.getElementById("status");


/*
========================================
SUBMIT
========================================
*/

form.addEventListener(
"submit",
async function(event){

    event.preventDefault();

    statusBox.className =
        "status";

    statusBox.textContent =
        "";

    submitButton.disabled =
        true;

    submitButton.textContent =
        "Adding app...";


    const data = {

        name:
            nameInput.value.trim(),

        version:
            versionInput.value.trim(),

        platform:
            platformInput.value.trim() ||
            "Android",

        category:
            categoryInput.value,

        description:
            descriptionInput.value.trim(),

        image:
            imageInput.value.trim(),

        download:
            downloadInput.value.trim()

    };


    try{

        const response =
        await fetch(
            API_URL,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json",

                    "X-Admin-Key":
                        adminKey.value
                },

                body:
                    JSON.stringify(data)
            }
        );


        const result =
        await response.json();


        if(!response.ok){

            throw new Error(
                result.error ||
                "Failed to add app."
            );

        }


        statusBox.className =
            "status success";

        statusBox.textContent =
            "✅ App added successfully!";


        nameInput.value = "";

        versionInput.value = "";

        descriptionInput.value = "";

        imageInput.value = "";

        downloadInput.value = "";


    }
    catch(error){

        statusBox.className =
            "status error";

        statusBox.textContent =
            "❌ " +
            (
                error.message ||
                "Something went wrong."
            );

    }


    submitButton.disabled =
        false;

    submitButton.textContent =
        "Add App";

});

</script>

</body>
</html>
