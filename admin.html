<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RHK PROVIDER - Admin</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0b0b0f;
    color:#fff;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
}

.header{
    text-align:center;
    padding:20px 0 25px;
}

.header h1{
    font-size:30px;
}

.header h1 span{
    color:#7c5cff;
}

.header p{
    color:#777780;
    margin-top:8px;
    font-size:14px;
}

.card{
    background:#15151b;
    border:1px solid #292932;
    border-radius:20px;
    padding:20px;
}

label{
    display:block;
    color:#aaa;
    font-size:14px;
    margin:17px 0 8px;
}

input,
textarea,
select{
    width:100%;
    padding:14px;
    border-radius:11px;
    border:1px solid #30303a;
    background:#0f0f14;
    color:white;
    outline:none;
    font-size:15px;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#7c5cff;
}

textarea{
    min-height:100px;
    resize:vertical;
}

select{
    appearance:auto;
}

button{
    width:100%;
    border:0;
    padding:15px;
    border-radius:12px;
    background:#7c5cff;
    color:white;
    font-size:16px;
    font-weight:bold;
    margin-top:22px;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
}

.status{
    display:none;
    margin-top:18px;
    padding:14px;
    border-radius:11px;
    line-height:1.5;
    font-size:14px;
}

.status.success{
    display:block;
    background:#12351f;
    color:#7dffac;
    border:1px solid #205c35;
}

.status.error{
    display:block;
    background:#351515;
    color:#ff8585;
    border:1px solid #633030;
}

.info{
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    background:#171421;
    border:1px solid #30264b;
    color:#aaa;
    font-size:13px;
    line-height:1.6;
}

.info strong{
    color:#fff;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#aaa;
    font-size:14px;
}

.back:hover{
    color:white;
}

@media(max-width:600px){

    body{
        padding:15px;
    }

    .card{
        padding:17px;
    }

    .header h1{
        font-size:27px;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>
RHK <span>PROVIDER</span>
</h1>

<p>
Admin Panel
</p>

</div>


<div class="card">

<form id="appForm">


<label>
App Name
</label>

<input
type="text"
id="name"
placeholder="Example App"
required
>


<label>
Version
</label>

<input
type="text"
id="version"
placeholder="1.0"
required
>


<label>
Platform
</label>

<input
type="text"
id="platform"
value="Android"
required
>


<label>
Category
</label>

<select id="category">

<option value="tools">
Tools
</option>

<option value="video">
Video
</option>

<option value="other">
Other
</option>

</select>


<label>
Description
</label>

<textarea
id="description"
placeholder="Write app description..."
required
></textarea>


<label>
Icon filename
</label>

<input
type="text"
id="image"
placeholder="example.png"
>


<label>
APK Download URL
</label>

<input
type="url"
id="download"
placeholder="https://github.com/..."
required
>


<button
type="submit"
id="addButton"
>
ADD APP
</button>


</form>


<div
id="status"
class="status"
></div>


<div class="info">

<strong>Icon:</strong>
Upload the PNG image to the same GitHub repository as
<code>admin.html</code>, then enter its filename here.

<br><br>

Example:

<code>myapp.png</code>

<br><br>

<strong>APK:</strong>
Paste the authorized APK Release download URL.

</div>

</div>


<a
href="index.html"
class="back"
>
← Back to RHK PROVIDER
</a>

</div>


<script>


/*
====================================
YOUR CLOUDFLARE WORKER URL
====================================

After we create the Worker,
you will replace this URL.

DO NOT PUT YOUR GITHUB TOKEN HERE.
*/

const API_URL =
"https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev";


const form =
document.getElementById(
"appForm"
);

const addButton =
document.getElementById(
"addButton"
);

const statusBox =
document.getElementById(
"status"
);


form.addEventListener(
"submit",
async function(event){

    event.preventDefault();


    addButton.disabled =
    true;

    addButton.textContent =
    "ADDING APP...";


    statusBox.className =
    "status";

    statusBox.style.display =
    "none";


    const app = {

        name:
        document.getElementById(
            "name"
        ).value.trim(),

        version:
        document.getElementById(
            "version"
        ).value.trim(),

        platform:
        document.getElementById(
            "platform"
        ).value.trim(),

        category:
        document.getElementById(
            "category"
        ).value,

        description:
        document.getElementById(
            "description"
        ).value.trim(),

        image:
        document.getElementById(
            "image"
        ).value.trim(),

        download:
        document.getElementById(
            "download"
        ).value.trim()

    };


    try{

        const response =
        await fetch(
            API_URL,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify(app)
            }
        );


        const result =
        await response.json();


        if(!response.ok){

            throw new Error(
                result.error ||
                "Unable to add app."
            );

        }


        statusBox.className =
        "status success";

        statusBox.textContent =
        "✅ App added successfully!";


        form.reset();


        document.getElementById(
            "platform"
        ).value =
        "Android";


    }
    catch(error){

        statusBox.className =
        "status error";

        statusBox.textContent =
        "❌ " +
        error.message;

    }


    addButton.disabled =
    false;

    addButton.textContent =
    "ADD APP";

});


</script>

</body>
  </html>
